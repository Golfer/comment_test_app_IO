# Production-ish stack using the optimized production image (Dockerfile).
#
#   RAILS_MASTER_KEY=$(cat config/master.key) docker compose -f docker-compose.prod.yml up --build -d
#
# Provide secrets via environment (or a .env file): RAILS_MASTER_KEY,
# SECRET_KEY_BASE, and strong DB / Meilisearch credentials.

x-prod-app: &prod_app
  build:
    context: .
    dockerfile: Dockerfile
  image: comment_app_prod
  environment: &prod_env
    RAILS_ENV: production
    RAILS_LOG_TO_STDOUT: "true"
    RAILS_SERVE_STATIC_FILES: "true"
    RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
    SECRET_KEY_BASE: ${SECRET_KEY_BASE}
    DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/comment_app_production
    REDIS_URL: redis://redis:6379/0
    MEILISEARCH_URL: http://meilisearch:7700
    MEILISEARCH_API_KEY: ${MEILI_MASTER_KEY:-changeme-master-key}
    APP_HOST: ${APP_HOST:-localhost}
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
    meilisearch:
      condition: service_started

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: comment_app_production
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  meilisearch:
    image: getmeili/meilisearch:v1.10
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-changeme-master-key}
      MEILI_NO_ANALYTICS: "true"
      MEILI_ENV: production
    volumes:
      - meili_data:/meili_data

  web:
    <<: *prod_app
    command: ["./bin/thrust", "./bin/rails", "server"]
    ports:
      - "80:80"

  worker:
    <<: *prod_app
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.interactive.yml"]

  worker_generation:
    <<: *prod_app
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.generation.yml"]

volumes:
  pg_data:
  redis_data:
  meili_data:
